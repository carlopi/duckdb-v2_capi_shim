# The in-house dispatcher: follows DuckDB's published alphas of the two lines this shim supports, and builds the shim for
# each new one, so a new alpha gets its shim without anyone sending a callback. Hourly, it reads DuckDB's own pointers
# (what install.sh --version v2.0-alpha / v2.1-alpha installs):
#   https://duckdb-staging.duckdb.org/release/2.0/latest_alpha_version.txt   (v2.0-cyanoptera)
#   https://duckdb-staging.duckdb.org/release/2.1/latest_alpha_version.txt   (main)
# each "<commit>/<version>", e.g. a28f463cff/v2.1.0-alpha57892. An alpha calls itself by that version, checks footers
# against it, and INSTALL looks in <version>/<platform>/, so that is what it is built and published as. If the extension
# repository's Pages has it for every platform, or a build for it is running, nothing happens; otherwise build.yml is
# started for that commit and version. Its own GITHUB_TOKEN is enough: workflow_dispatch events made with it do start
# workflows.
name: dispatcher

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Build the shim for new alphas
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STAGING: https://duckdb-staging.duckdb.org
          PAGES: https://carlopi.github.io/example-duckdb-extension-repository
          PLATFORMS: "linux_amd64 linux_arm64 osx_amd64 osx_arm64"
        run: |
          set -euo pipefail
          running=$(gh run list --repo "$REPO" --workflow build.yml --limit 50 --json status,displayTitle \
            --jq '.[] | select(.status != "completed") | .displayTitle')
          for pair in 2.0:v2.0-cyanoptera 2.1:main; do
            series=${pair%%:*}; line=${pair#*:}
            staged=$(curl -sf "$STAGING/release/$series/latest_alpha_version.txt" | tr -d '[:space:]') || {
              echo "$series: no published alpha"; continue; }
            commit=${staged%%/*}; version=${staged#*/}
            case "$commit/$version" in *[!A-Za-z0-9._/-]*|/*|*/) echo "$series: unexpected pointer '$staged'" >&2; continue ;; esac
            missing=""
            for p in $PLATFORMS; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -I "$PAGES/$version/$p/v2_capi_shim.duckdb_extension.gz")
              [ "$code" = 200 ] || missing="$missing $p"
            done
            if [ -z "$missing" ]; then echo "$version ($line): published"; continue; fi
            if printf '%s\n' "$running" | grep -qF -- "$version"; then echo "$version ($line): building already"; continue; fi
            echo "$version ($line, $commit): missing for$missing: building"
            gh workflow run build.yml --repo "$REPO" -f duckdb_ref="$commit" -f duckdb_version="$version" -f line="$line"
          done
