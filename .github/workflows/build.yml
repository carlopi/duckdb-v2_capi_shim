# Builds v2_capi_shim for a given DuckDB: check out DuckDB at that ref, build it with
#   duckdb_extension_load(v2_capi_shim SOURCE_DIR <this repository>)
# run tests/run.sh against the result, and upload the extension as an artifact.
#
# Which DuckDB:
#   - workflow_dispatch: the duckdb_ref input (a tag, branch or commit)
#   - repository_dispatch (a callback, e.g. from whatever publishes a DuckDB nightly or release):
#       POST /repos/carlopi/duckdb-v2_capi_shim/dispatches
#       {"event_type": "build-for-duckdb", "client_payload": {"duckdb_ref": "<sha or tag>"}}
#     (event types duckdb-nightly and duckdb-release work the same)
#   - push, pull_request, schedule: v2.0.1 (the contract) and main
name: build

on:
  workflow_dispatch:
    inputs:
      duckdb_ref:
        description: "DuckDB tag, branch or commit to build the shim for"
        required: true
        default: main
  repository_dispatch:
    types: [build-for-duckdb, duckdb-nightly, duckdb-release]
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.pick.outputs.refs }}
    steps:
      - id: pick
        env:
          INPUT_REF: ${{ github.event.inputs.duckdb_ref }}
          PAYLOAD_REF: ${{ github.event.client_payload.duckdb_ref }}
        run: |
          ref="${INPUT_REF:-$PAYLOAD_REF}"
          if [ -n "$ref" ]; then
            # only what a git ref can be: no quotes or spaces reach the build
            case "$ref" in *[!A-Za-z0-9._/-]*) echo "invalid duckdb_ref: $ref" >&2; exit 1 ;; esac
            echo "refs=[\"$ref\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'refs=["v2.0.1", "main"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: refs
    strategy:
      fail-fast: false
      matrix:
        duckdb_ref: ${{ fromJSON(needs.refs.outputs.refs) }}
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: duckdb ${{ matrix.duckdb_ref }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: v2_capi_shim

      - name: Tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build ccache; else brew install ninja ccache; fi

      - name: DuckDB at ${{ matrix.duckdb_ref }}
        env:
          REF: ${{ matrix.duckdb_ref }}
        run: |
          git init -q duckdb && cd duckdb
          git remote add origin https://github.com/duckdb/duckdb
          git fetch -q --depth 1 origin "$REF" || git fetch -q origin "$REF"
          git checkout -q FETCH_HEAD
          git fetch -q --depth 1 origin 'refs/tags/*:refs/tags/*' 2>/dev/null || true
          echo "DUCKDB_SHA=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_ENV"
          echo "duckdb_extension_load(v2_capi_shim SOURCE_DIR $GITHUB_WORKSPACE/v2_capi_shim)" > "$GITHUB_WORKSPACE/shim_config.cmake"

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.os }}-${{ matrix.duckdb_ref }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-${{ matrix.duckdb_ref }}-

      - name: Build DuckDB with v2_capi_shim
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cd duckdb
          cmake -G Ninja -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DBUILD_UNITTESTS=0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DDUCKDB_EXTENSION_CONFIGS="$GITHUB_WORKSPACE/shim_config.cmake"
          ninja -C build/release duckdb v2_capi_shim_loadable_extension

      - name: Test
        run: |
          v2_capi_shim/tests/run.sh duckdb/build/release/duckdb \
            duckdb/build/release/extension/v2_capi_shim/v2_capi_shim.duckdb_extension

      - name: Name the artifact
        env:
          REF: ${{ matrix.duckdb_ref }}
        run: |
          D=duckdb/build/release/duckdb
          echo "PLATFORM=$($D -csv -noheader -c 'PRAGMA platform')" >> "$GITHUB_ENV"
          echo "SAFE_REF=$(printf '%s' "$REF" | tr '/' '-')" >> "$GITHUB_ENV"
          # where INSTALL looks for it, by DuckDB's own rule: a release's version tag, else its source id
          version=$($D -csv -noheader -c 'SELECT library_version FROM pragma_version()')
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) case "$version" in *-*) dir=$($D -csv -noheader -c 'SELECT source_id FROM pragma_version()') ;; *) dir="$version" ;; esac ;;
            *) dir=$($D -csv -noheader -c 'SELECT source_id FROM pragma_version()') ;;
          esac
          mkdir -p artifact
          cp duckdb/build/release/extension/v2_capi_shim/v2_capi_shim.duckdb_extension artifact/
          printf '%s\n%s\n%s\n' "$dir" "$($D -csv -noheader -c 'PRAGMA platform')" "$(git -C duckdb rev-parse HEAD)" > artifact/target.txt

      - uses: actions/upload-artifact@v4
        with:
          name: v2_capi_shim-${{ env.SAFE_REF }}-${{ env.DUCKDB_SHA }}-${{ env.PLATFORM }}
          path: artifact/

  # Signed with the extension repository's key and committed to its main branch, which GitHub Pages serves as
  # https://carlopi.github.io/example-duckdb-extension-repository, at <version dir>/<platform>/v2_capi_shim.duckdb_extension.gz.
  # Needs, in this repository's secrets: EXTENSION_REPO_SIGNING_KEY (the PEM private key whose public key is in that
  # repository's .well-known/duckdb-extension-repo.json) and EXTENSION_REPO_SSH_KEY (the private half of a deploy key with write access on it).
  # Not for pull requests; without the secrets it says so and does nothing.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: publish-extension-repository
      cancel-in-progress: false
    steps:
      - name: Secrets present?
        id: secrets
        env:
          KEY: ${{ secrets.EXTENSION_REPO_SIGNING_KEY }}
          SSH_KEY: ${{ secrets.EXTENSION_REPO_SSH_KEY }}
        run: |
          if [ -n "$KEY" ] && [ -n "$SSH_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else
            echo "::notice::EXTENSION_REPO_SIGNING_KEY / EXTENSION_REPO_SSH_KEY not set: nothing published"; echo "ok=0" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ok == '1'
        with:
          pattern: v2_capi_shim-*
          path: built

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == '1'
        with:
          repository: carlopi/example-duckdb-extension-repository
          ref: main
          ssh-key: ${{ secrets.EXTENSION_REPO_SSH_KEY }}
          path: repo

      - name: Sign, place, commit, push
        if: steps.secrets.outputs.ok == '1'
        env:
          KEY: ${{ secrets.EXTENSION_REPO_SIGNING_KEY }}
          SHIM_SHA: ${{ github.sha }}
        run: |
          umask 077
          key="$RUNNER_TEMP/signing-key.pem"
          printf '%s\n' "$KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          cd repo
          git config user.name "v2_capi_shim CI"
          git config user.email "v2_capi_shim-ci@users.noreply.github.com"
          placed=""
          for d in ../built/*/; do
            dir=$(sed -n 1p "$d/target.txt"); platform=$(sed -n 2p "$d/target.txt"); duckdb_sha=$(sed -n 3p "$d/target.txt")
            # DuckDB's build wrote the footer with an empty signature: replace those 256 bytes with the repository's
            RESIGN=1 scripts/sign-extension.sh "$key" "$d/v2_capi_shim.duckdb_extension" "$dir" "$platform"
            placed="$placed $dir/$platform (duckdb ${duckdb_sha:0:10})"
          done
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "v2_capi_shim ${SHIM_SHA:0:7}:$placed"
          for attempt in 1 2 3 4 5; do
            git push -q origin HEAD:main && exit 0
            git pull -q --rebase origin main
          done
          exit 1
