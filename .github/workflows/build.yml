# Builds v2_capi_shim for a given DuckDB with extension-ci-tools' distribution workflow (DuckDB's own build images,
# Linux and macOS: linux_amd64, linux_arm64, osx_amd64, osx_arm64, and Linux musl), then asks
# carlopi/example-duckdb-extension-repository to publish the run.
#
# Which DuckDB:
#   - workflow_dispatch: the duckdb_ref input (a tag, branch or commit)
#   - repository_dispatch (a callback, e.g. from whatever publishes a DuckDB nightly or release):
#       POST /repos/carlopi/duckdb-v2_capi_shim/dispatches
#       {"event_type": "build-for-duckdb", "client_payload": {"duckdb_ref": "<sha or tag>"}}
#     (event types duckdb-nightly and duckdb-release work the same)
#   - push, pull_request, schedule: main (where the v2 C API moves; a new release comes in by callback, duckdb-release)
name: build

on:
  workflow_dispatch:
    inputs:
      duckdb_ref:
        description: "DuckDB tag, branch or commit to build the shim for"
        required: true
        default: main
  repository_dispatch:
    types: [build-for-duckdb, duckdb-nightly, duckdb-release]
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

jobs:
  # The requested ref (default main) resolved to what extension-ci-tools needs: duckdb_commit is checked out,
  # duckdb_version is stamped into the footer verbatim, so it must be what that DuckDB calls itself: a release's tag, or
  # for anything else the commit's first 10 characters (DuckDB's source id, the directory INSTALL looks in)
  ref:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      commit: ${{ steps.pick.outputs.commit }}
    steps:
      - id: pick
        env:
          INPUT_REF: ${{ github.event.inputs.duckdb_ref }}
          PAYLOAD_REF: ${{ github.event.client_payload.duckdb_ref }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_REF: main
        run: |
          ref="${INPUT_REF:-$PAYLOAD_REF}"
          ref="${ref:-$DEFAULT_REF}"
          # only what a git ref can be: no quotes or spaces reach the build
          case "$ref" in *[!A-Za-z0-9._/-]*) echo "invalid duckdb_ref: $ref" >&2; exit 1 ;; esac
          if printf '%s' "$ref" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version=$ref" >> "$GITHUB_OUTPUT"; echo "commit=" >> "$GITHUB_OUTPUT"
            echo "DuckDB $ref (release)"
          else
            sha=$(gh api "repos/duckdb/duckdb/commits/$ref" --jq .sha)
            echo "version=${sha:0:10}" >> "$GITHUB_OUTPUT"; echo "commit=$sha" >> "$GITHUB_OUTPUT"
            echo "DuckDB $ref = $sha"
          fi

  # main by default, or the requested ref, with current tooling
  target:
    needs: ref
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: ${{ needs.ref.outputs.version }}
      duckdb_commit: ${{ needs.ref.outputs.commit }}
      ci_tools_version: main
      extension_name: v2_capi_shim
      exclude_archs: "windows_amd64;windows_amd64_mingw;windows_arm64;wasm_mvp;wasm_eh;wasm_threads"
      # opt-in in extension-ci-tools' matrix
      opt_in_archs: "osx_amd64"

  # The same shim across DuckDB versions: for every v2 release and every main commit that changed duckdb_v2.h, the
  # adapters generated and compiled against that commit's headers alone (no DuckDB build, about a minute). A table in
  # the run summary; informational: a ref the shim does not cover does not fail the run
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DuckDB history (blobs fetched on demand)
        run: git clone -q --filter=blob:none --no-checkout https://github.com/duckdb/duckdb duckdb-git
      - name: Sweep
        run: |
          set +e
          python3 tests/sweep.py duckdb-git > sweep.txt
          status=$?
          cat sweep.txt
          { echo "### v2_capi_shim coverage (contract v2.0.1)"; echo '```'; cat sweep.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ $status -eq 0 ] || echo "::notice::some DuckDB refs are not covered by this shim: see the summary"

  # Asks carlopi/example-duckdb-extension-repository to publish this run's builds: it checks the run (listed producer,
  # succeeded, allowed branch), signs them with its own key, and commits them to its main, which GitHub Pages serves.
  # Needs, in this repository's secrets: EXTENSION_REPO_DISPATCH_TOKEN (a token allowed to dispatch to that repository:
  # fine-grained, Contents read and write on it only) and EXTENSION_REPO_PUBLISH_TOKEN (this producer's publish token,
  # whose SHA-256 that repository's sources.json lists). Not for pull requests; without the secrets it does nothing.
  notify:
    needs: target
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Ask the extension repository to publish
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO_DISPATCH_TOKEN }}
          PUBLISH_TOKEN: ${{ secrets.EXTENSION_REPO_PUBLISH_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$PUBLISH_TOKEN" ]; then
            echo "::notice::EXTENSION_REPO_DISPATCH_TOKEN / EXTENSION_REPO_PUBLISH_TOKEN not set: not asking to publish"; exit 0
          fi
          jq -n --arg repo "$REPO" --argjson run "$RUN" --arg token "$PUBLISH_TOKEN" \
            '{event_type: "publish-extensions", client_payload: {repository: $repo, run_id: $run, token: $token}}' |
            gh api repos/carlopi/example-duckdb-extension-repository/dispatches --input -
          echo "asked carlopi/example-duckdb-extension-repository to publish run $RUN"
