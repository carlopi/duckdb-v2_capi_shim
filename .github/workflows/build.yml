# Builds v2_capi_shim for a given DuckDB: check out DuckDB at that ref, build it with
#   duckdb_extension_load(v2_capi_shim SOURCE_DIR <this repository>)
# run tests/run.sh against the result, and upload the extension as an artifact.
#
# Which DuckDB:
#   - workflow_dispatch: the duckdb_ref input (a tag, branch or commit)
#   - repository_dispatch (a callback, e.g. from whatever publishes a DuckDB nightly or release):
#       POST /repos/<owner>/v2_capi_shim/dispatches
#       {"event_type": "build-for-duckdb", "client_payload": {"duckdb_ref": "<sha or tag>"}}
#     (event types duckdb-nightly and duckdb-release work the same)
#   - push, pull_request, schedule: v2.0.1 (the contract) and main
name: build

on:
  workflow_dispatch:
    inputs:
      duckdb_ref:
        description: "DuckDB tag, branch or commit to build the shim for"
        required: true
        default: main
  repository_dispatch:
    types: [build-for-duckdb, duckdb-nightly, duckdb-release]
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.pick.outputs.refs }}
    steps:
      - id: pick
        env:
          INPUT_REF: ${{ github.event.inputs.duckdb_ref }}
          PAYLOAD_REF: ${{ github.event.client_payload.duckdb_ref }}
        run: |
          ref="${INPUT_REF:-$PAYLOAD_REF}"
          if [ -n "$ref" ]; then
            # only what a git ref can be: no quotes or spaces reach the build
            case "$ref" in *[!A-Za-z0-9._/-]*) echo "invalid duckdb_ref: $ref" >&2; exit 1 ;; esac
            echo "refs=[\"$ref\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'refs=["v2.0.1", "main"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: refs
    strategy:
      fail-fast: false
      matrix:
        duckdb_ref: ${{ fromJSON(needs.refs.outputs.refs) }}
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: duckdb ${{ matrix.duckdb_ref }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: v2_capi_shim

      - name: Tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build ccache; else brew install ninja ccache; fi

      - name: DuckDB at ${{ matrix.duckdb_ref }}
        env:
          REF: ${{ matrix.duckdb_ref }}
        run: |
          git init -q duckdb && cd duckdb
          git remote add origin https://github.com/duckdb/duckdb
          git fetch -q --depth 1 origin "$REF" || git fetch -q origin "$REF"
          git checkout -q FETCH_HEAD
          git fetch -q --depth 1 origin 'refs/tags/*:refs/tags/*' 2>/dev/null || true
          echo "DUCKDB_SHA=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_ENV"
          echo "duckdb_extension_load(v2_capi_shim SOURCE_DIR $GITHUB_WORKSPACE/v2_capi_shim)" > "$GITHUB_WORKSPACE/shim_config.cmake"

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.os }}-${{ matrix.duckdb_ref }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-${{ matrix.duckdb_ref }}-

      - name: Build DuckDB with v2_capi_shim
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cd duckdb
          cmake -G Ninja -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DBUILD_UNITTESTS=0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DDUCKDB_EXTENSION_CONFIGS="$GITHUB_WORKSPACE/shim_config.cmake"
          ninja -C build/release duckdb v2_capi_shim_loadable_extension

      - name: Test
        run: |
          v2_capi_shim/tests/run.sh duckdb/build/release/duckdb \
            duckdb/build/release/extension/v2_capi_shim/v2_capi_shim.duckdb_extension

      - name: Name the artifact
        env:
          REF: ${{ matrix.duckdb_ref }}
        run: |
          echo "PLATFORM=$(duckdb/build/release/duckdb -csv -noheader -c 'PRAGMA platform')" >> "$GITHUB_ENV"
          echo "SAFE_REF=$(printf '%s' "$REF" | tr '/' '-')" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: v2_capi_shim-${{ env.SAFE_REF }}-${{ env.DUCKDB_SHA }}-${{ env.PLATFORM }}
          path: duckdb/build/release/extension/v2_capi_shim/v2_capi_shim.duckdb_extension
